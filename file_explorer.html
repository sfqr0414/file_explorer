const getSvg = (key, color='#8f8f8f') => `<svg viewBox="0 0 24 24" fill="${color}" style="width:100%;height:100%; display:block;">${SVGS[key]||SVGS.file}</svg>`;

class MockFileService {
  constructor() {

    const initNode = (path, type, name) => { this.fs[path] = { type, name, children: type==='folder'?[]:undefined, size: type==='folder'?0:Math.floor(Math.random()*500000), created: new Date(Date.now() - Math.random()*10000000000).toLocaleString(), modified: new Date().toLocaleString(), owner: 'Administrator', perms: '读/写/执行' }; };

    this.fs["C:"].children.push("Windows", "Users", "MassiveData");
    initNode("C:/Windows/explorer.exe", "file", "explorer.exe"); this.fs["C:/Windows"].children.push("explorer.exe");
    initNode("C:/Users/readme.md", "file", "readme.md"); this.fs["C:/Users"].children.push("readme.md");

  }
  async getFolderContents(path) { await delay(100); if (!this.fs[path] || this.fs[path].type !== "folder") throw new Error("目录不存在"); return this.fs[path].children.map(childName => { const cp = normalizePath(path, childName); return { path: cp, ...this.fs[cp] }; }); }

    for (let key in this.fs) { if (pathSet.has(key)) { keysToDelete.push(key); continue; } for (let pref of prefixes) { if (key.startsWith(pref)) { keysToDelete.push(key); break; } } }
    keysToDelete.forEach(k => delete this.fs[k]);
    paths.forEach(p => { const parentPath = p.substring(0, p.lastIndexOf('/')) || 'C:', name = p.substring(p.lastIndexOf('/') + 1); if(this.fs[parentPath]) this.fs[parentPath].children = this.fs[parentPath].children.filter(c => c !== name); });
  }

    let finalName = name; let counter = 1;
    while(this.fs[normalizePath(parentPath, finalName)]) finalName = `${name.split('.')[0]}(${counter++})${name.includes('.')?'.'+name.split('.').pop():''}`;
    const newPath = normalizePath(parentPath, finalName);
    this.fs[newPath] = { type, name: finalName, children: type === 'folder' ? [] : undefined, size: type==='folder'?0:1024, created: new Date().toLocaleString(), modified: new Date().toLocaleString(), owner: 'Admin', perms: '读/写/执行' };

  }

  }

      window.dispatchEvent(new Event('hide-context'));
      if(e.button !== 0 && e.pointerType === 'mouse') return;
      
      const rect = this.scroller.getBoundingClientRect();
      if (e.clientX >= rect.right - 16) return; 
      
      cleanup(); startX = e.clientX - rect.left + this.scroller.scrollLeft; startY = e.clientY - rect.top + this.scroller.scrollTop; lastClientY = e.clientY;
      const itemEl = e.target.closest('.item');
      
      if (e.pointerType === 'mouse') {
         state = 'MOUSE_WAIT';
         if (itemEl) { if (!e.ctrlKey && !this.selectedIds.has(itemEl.dataset.path)) { this.selectedIds.clear(); this.selectedIds.add(itemEl.dataset.path); this.syncSelectionVisuals(); } } 
         else { if (!e.ctrlKey) { this.selectedIds.clear(); this.syncSelectionVisuals(); } }
      } else {
         state = 'TOUCH_WAIT';

            if(state === 'TOUCH_WAIT') {

               if(itemEl && !this.selectedIds.has(itemEl.dataset.path)) { this.selectedIds.clear(); this.selectedIds.add(itemEl.dataset.path); this.syncSelectionVisuals(); }
               this.dispatchEvent(new CustomEvent('context', { detail: { x: e.clientX, y: e.clientY, type: itemEl ? itemEl.dataset.type : 'empty' }, bubbles: true, composed: true }));
            }
         }, 400);
      }
    });

    this.scroller.addEventListener('pointermove', (e) => {
      if (state === 'IDLE' || state === 'SCROLLING') return;
      const rect = this.scroller.getBoundingClientRect(), currX = e.clientX - rect.left + this.scroller.scrollLeft, currY = e.clientY - rect.top + this.scroller.scrollTop; 
      lastClientY = e.clientY; const dist = Math.abs(currY - startY) + Math.abs(currX - startX);
      
      if (e.pointerType === 'mouse') {
         if (state === 'MOUSE_WAIT' && dist > 5) {
            const itemEl = this.shadowRoot.elementFromPoint(e.clientX, e.clientY)?.closest('.item');
            state = (this.selectedIds.size > 0 && itemEl && this.selectedIds.has(itemEl.dataset.path)) ? 'DRAG' : 'MARQUEE';
            if(state === 'MARQUEE') { this.selectedIds.clear(); this.syncSelectionVisuals(); }
            this.scroller.setPointerCapture(e.pointerId);
         }
      } else {
         if (state === 'TOUCH_WAIT' && dist > 10) { clearTimeout(longPressTimer); state = 'SCROLLING'; return; }
         else if (state === 'TOUCH_LONG_PRESSED' && dist > 5) { 
             window.dispatchEvent(new Event('hide-context')); 
             const itemEl = this.shadowRoot.elementFromPoint(e.clientX, e.clientY)?.closest('.item'); 
             state = (this.selectedIds.size > 0 && itemEl && this.selectedIds.has(itemEl.dataset.path)) ? 'DRAG' : 'MARQUEE'; 
             if(state === 'MARQUEE') { this.selectedIds.clear(); this.syncSelectionVisuals(); } 
             this.scroller.setPointerCapture(e.pointerId);
         }
      }

      if (state === 'MARQUEE') {
        const update = (cY) => {
          const mT = Math.min(startY, cY), mB = Math.max(startY, cY), mL = Math.min(startX, currX), mR = Math.max(startX, currX);
          this.marquee.style.display = 'block'; this.marquee.style.left = `${mL}px`; this.marquee.style.top = `${mT}px`; this.marquee.style.width = `${mR - mL}px`; this.marquee.style.height = `${mB - mT}px`;
          this.selectedIds.clear(); const tr = Math.ceil(this.renderedItems.length / cols()), sr = Math.max(0, Math.floor(mT / iH())), er = Math.min(tr - 1, Math.floor(mB / iH())), sc = Math.max(0, Math.floor(mL / iW())), ec = Math.min(cols() - 1, Math.floor(mR / iW()));
          for (let r = sr; r <= er; r++) for (let c = sc; c <= ec; c++) { const idx = r * cols() + c; if (idx < this.renderedItems.length) { const rt = r * iH(), rb = rt + iH(), rl = c * iW(), rr = rl + iW(); if (!(rr <= mL || rl >= mR || rb <= mT || rt >= mB)) this.selectedIds.add(this.renderedItems[idx].path); } }
          this.syncSelectionVisuals();
        }; update(currY); startEdgeScroll(update);
      }
      
      if (state === 'DRAG') {
        if (!ghostEl) { ghostEl = document.createElement('div'); ghostEl.className = 'drag-ghost'; ghostEl.innerHTML = `📄 <span class="badge">${this.selectedIds.size}</span> 项移动中`; document.body.appendChild(ghostEl); }
        if (!this.ghostRaf) { this.ghostRaf = requestAnimationFrame(() => { if (ghostEl) { ghostEl.style.transform = `translate(${e.clientX + 10}px, ${e.clientY + 10}px)`; } this.ghostRaf = null; }); }
        ghostEl.style.display = 'none'; const hoverEl = this.shadowRoot.elementFromPoint(e.clientX, e.clientY)?.closest('.item[data-type="folder"]'); ghostEl.style.display = 'flex';
        if (dragTargetItem && dragTargetItem !== hoverEl) dragTargetItem.classList.remove('drag-over');
        if (hoverEl && !this.selectedIds.has(hoverEl.dataset.path)) { hoverEl.classList.add('drag-over'); dragTargetItem = hoverEl; } else dragTargetItem = null;
        startEdgeScroll(()=>{});
      }
    });

    const endInteraction = (e) => {
      const s = state, target = dragTargetItem; cleanup(); 
      try { this.scroller.releasePointerCapture(e.pointerId); } catch(err){}
      if (s === 'MOUSE_WAIT' || s === 'TOUCH_WAIT') {
         const itemEl = e.target.closest('.item');
         if (itemEl) { if (!e.ctrlKey) this.selectedIds.clear(); this.selectedIds.add(itemEl.dataset.path); this.syncSelectionVisuals(); } 
         else { this.selectedIds.clear(); this.syncSelectionVisuals(); }
      }
      else if (s === 'DRAG' && target) {
         this.dispatchEvent(new CustomEvent('file-move', { detail: { sources: Array.from(this.selectedIds), targetFolder: target.dataset.path }, bubbles: true, composed: true }));
      }

    this.scroller.addEventListener('pointerup', endInteraction);
    this.scroller.addEventListener('pointercancel', endInteraction);
  }
}

/** 6. 多层右键菜单引擎 */
class FMContextMenu extends HTMLElement {
  constructor() { super(); this.attachShadow({ mode: "open" }); }
  connectedCallback() {
    this.shadowRoot.innerHTML = `<style>:host { display: none; position: fixed; background: rgba(255,255,255,0.98); backdrop-filter: blur(10px); border: 1px solid var(--slate-5); border-radius: 6px; box-shadow: 0 4px 16px rgba(0,0,0,0.15); min-width: 160px; z-index: 1000; font-size: 13px; padding: 4px; transform-origin: top left; } :host(.show) { display: block; animation: popIn 0.2s forwards; } .menu-item { position: relative; padding: 6px 12px; border-radius: 4px; cursor: pointer; display: flex; align-items: center; gap: 8px; color: var(--slate-12); } .menu-item:hover { background: var(--blue-9); color: white; } .divider { height: 1px; background: var(--slate-4); margin: 4px 0; } 
      .has-submenu { padding-right: 24px; } .has-submenu::after { content: "▶"; position: absolute; right: 8px; font-size: 10px; color: var(--slate-8); } .menu-item:hover::after { color: white; }
      .submenu { position: absolute; left: 100%; top: -4px; background: rgba(255,255,255,0.98); border: 1px solid var(--slate-5); border-radius: 6px; box-shadow: 0 4px 16px rgba(0,0,0,0.15); display: none; flex-direction: column; min-width: 140px; padding: 4px; backdrop-filter: blur(10px); color: var(--slate-12); }
      .has-submenu:hover > .submenu { display: flex; animation: popIn 0.2s forwards; }
      .submenu.left-side { left: auto; right: 100%; }
      @keyframes popIn { from { opacity: 0; transform: scale(0.96) translateY(-4px); } to { opacity: 1; transform: scale(1) translateY(0); } }</style>
      <div id="container"></div>`;
    document.addEventListener('pointerdown', (e) => { if (!e.composedPath().includes(this)) this.hide(); }); window.addEventListener('hide-context', () => this.hide());
  }
  show(x, y, contextType) {
    let html = '';
    if (contextType === 'folder') { html += `<div class="menu-item" data-action="open" style="font-weight:bold">打开</div><div class="divider"></div><div class="menu-item" data-action="copy">复制</div><div class="menu-item" data-action="cut">剪切</div><div class="menu-item" data-action="rename">重命名</div><div class="menu-item" data-action="delete" style="color:#E5484D">删除</div><div class="divider"></div><div class="menu-item" data-action="download">下载</div><div class="menu-item" data-action="properties">属性</div>`; } 
    else if (contextType === 'file') { html += `<div class="menu-item" data-action="view-file" style="font-weight:bold">查看</div><div class="divider"></div><div class="menu-item" data-action="copy">复制</div><div class="menu-item" data-action="cut">剪切</div><div class="menu-item" data-action="rename">重命名</div><div class="menu-item" data-action="delete" style="color:#E5484D">删除</div><div class="divider"></div><div class="menu-item" data-action="download">下载</div><div class="menu-item" data-action="properties">属性</div>`; } 
    else { html += `<div class="menu-item has-submenu">查看<div class="submenu"><div class="menu-item" data-action="viewToggle">切换网格/列表</div></div></div><div class="menu-item has-submenu">排列方式<div class="submenu"><div class="menu-item" data-action="sort-name">按名称</div><div class="menu-item" data-action="sort-date">按日期</div><div class="menu-item" data-action="sort-size">按大小</div></div></div><div class="menu-item" data-action="refresh">刷新</div><div class="divider"></div><div class="menu-item" data-action="paste">粘贴</div><div class="menu-item" data-action="selectall">全选</div><div class="divider"></div><div class="menu-item has-submenu">新建<div class="submenu"><div class="menu-item" data-action="newfolder">📁 文件夹</div><div class="divider"></div><div class="menu-item" data-action="newfile-txt">📝 文本文档 (.txt)</div><div class="menu-item" data-action="newfile-md">📝 Markdown (.md)</div><div class="menu-item" data-action="newfile-js">🧑‍💻 JS 脚本 (.js)</div></div></div>`; }
    const container = this.shadowRoot.getElementById('container'); container.innerHTML = html;
    
    this.classList.add('show'); 
    container.querySelectorAll('.has-submenu').forEach(sub => { if (x + 160 + 140 > window.innerWidth) sub.querySelector('.submenu').classList.add('left-side'); });
    container.querySelectorAll('.menu-item').forEach(item => { item.addEventListener('click', (e) => { e.stopPropagation(); if(item.classList.contains('has-submenu')) return; this.dispatchEvent(new CustomEvent('action', { detail: item.dataset.action, bubbles: true, composed: true })); this.hide(); }); });
    const rect = this.getBoundingClientRect(); const finalX = Math.min(x, window.innerWidth - rect.width - 5), finalY = Math.min(y, window.innerHeight - rect.height - 5);
    this.style.left = `${finalX}px`; this.style.top = `${finalY}px`;
  }
  hide() { this.classList.remove('show'); }
}
customElements.define("fm-context-menu", FMContextMenu);

class FMStatusBar extends HTMLElement {

}

/** 7. 主编排框架 */
class WinFileExplorer extends HTMLElement {
  constructor() { super(); this.attachShadow({ mode: "open" }); this.currentPath = "C:"; this.history = []; this.historyIndex = -1; }
  async connectedCallback() {
    this.shadowRoot.innerHTML = `
      <style>:host { display: flex; flex-direction: column; height: 100%; border: 1px solid var(--slate-6); box-sizing: border-box; background: white; } .body-layout { display: flex; flex: 1; overflow: hidden; } .sidebar { width: 220px; background: white; border-right: 1px solid var(--slate-5); overflow-y: auto; padding: 8px; } .main-content { flex: 1; display: flex; flex-direction: column; position: relative; } @media (max-width: 768px) { .sidebar { display: none; } }</style>
      <fm-ribbon id="ribbon"></fm-ribbon>
      <fm-addressbar id="addressbar"></fm-addressbar>
      <div class="body-layout">
        <div class="sidebar" id="sidebar"><collapsible-tree id="realTree"></collapsible-tree></div>
        <div class="main-content"><fm-main-view id="mainview"></fm-main-view></div>
      </div>
      <fm-statusbar id="statusbar"></fm-statusbar>
      <fm-context-menu id="contextmenu"></fm-context-menu>
    `;
    this.mainview = this.shadowRoot.getElementById('mainview'); this.addressbar = this.shadowRoot.getElementById('addressbar'); this.realTree = this.shadowRoot.getElementById('realTree'); this.contextmenu = this.shadowRoot.getElementById('contextmenu'); this.statusbar = this.shadowRoot.getElementById('statusbar'); this.ribbon = this.shadowRoot.getElementById('ribbon');
    
    this.addEventListener('navigate', (e) => this.navigate(e.detail)); this.addEventListener('tree-navigate', (e) => this.navigate(e.detail)); this.addEventListener('tree-load', (e) => this.loadTreeFolders(e.detail.path, e.detail.el, true));
    this.addEventListener('nav-back', () => this.goBack()); this.addEventListener('nav-forward', () => this.goForward()); this.addEventListener('nav-up', () => this.goUp());
    this.addEventListener('action', (e) => this.handleAction(e.detail));
    this.addEventListener('search', (e) => this.mainview.filterItems(e.detail));
    this.addEventListener('context', (e) => this.contextmenu.show(e.detail.x, e.detail.y, e.detail.type));
    this.addEventListener('selectionChange', (e) => this.statusbar.update(this.mainview.renderedItems.length, e.detail.length));
    
    this.addEventListener('file-move', async (e) => {
      try { await API.moveItem(e.detail.sources, e.detail.targetFolder); showToast(`成功将选定的项移动至目录`); this.rebuildTree(); this.loadPath(this.currentPath, true); } catch(err) { showToast(err.message, true); }
    });

    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.altKey) { if (e.key === 'ArrowLeft') { e.preventDefault(); this.goBack(); } if (e.key === 'ArrowRight') { e.preventDefault(); this.goForward(); } if (e.key === 'ArrowUp') { e.preventDefault(); this.goUp(); } }
      else if (e.key === 'Backspace') { e.preventDefault(); this.goBack(); }
      else if (e.key === 'Delete') { e.preventDefault(); this.handleAction('delete'); }
      else if (e.key === 'F2') { e.preventDefault(); this.handleAction('rename'); }
      else if (e.ctrlKey || e.metaKey) { if (e.shiftKey && e.key.toLowerCase() === 'n') { e.preventDefault(); this.handleAction('newfile-txt'); } else { switch(e.key.toLowerCase()) { case 'a': e.preventDefault(); this.mainview.selectAll(); break; case 'n': e.preventDefault(); this.handleAction('newfolder'); break; } } }
      else if (e.key === 'Escape') { this.mainview.clearSelection(); window.dispatchEvent(new Event('hide-context')); document.getElementById('preview-modal').classList.remove('active'); document.getElementById('prop-modal').classList.remove('active'); }
      else if (e.key === 'F5') { e.preventDefault(); this.loadPath(this.currentPath, true); }
    });

    this.rebuildTree(); this.navigate("C:");
  }

  async rebuildTree() {
    const openPaths = new Set([...this.realTree.querySelectorAll('collapsible-item[open]')].map(el => el.getAttribute('path')));
    this.realTree.innerHTML = ''; const rootItem = document.createElement('collapsible-item'); rootItem.setAttribute('label', 'C:'); rootItem.setAttribute('path', 'C:'); this.realTree.appendChild(rootItem);
    const restore = async (node, path) => { if (openPaths.has(path) || path === 'C:') { await this.loadTreeFolders(path, node, false); node.setAttribute('open', ''); for (let child of node.querySelectorAll('collapsible-item')) await restore(child, child.getAttribute('path')); } };
    await restore(rootItem, 'C:'); this.syncTreeState(this.currentPath);
  }

  async loadTreeFolders(path, parentElement, doExpand = false) {
    if(parentElement.hasAttribute('loaded')) return;
    try { const items = await API.getFolderContents(path), folders = items.filter(i => i.type === 'folder'); parentElement.innerHTML = ''; folders.forEach(f => { const item = document.createElement('collapsible-item'); item.setAttribute('label', f.name); item.setAttribute('path', f.path); parentElement.appendChild(item); }); parentElement.setAttribute('loaded', 'true'); if(doExpand) parentElement.setAttribute('open', ''); } catch(e) {}
  }
  async syncTreeState(targetPath) {
    const ancestors = await API.getAncestors(targetPath); let currentContainer = this.realTree;
    for (const anc of ancestors) { let node = currentContainer.querySelector(`collapsible-item[path="${anc.path}"]`); if (node) { if (!node.hasAttribute('loaded')) await this.loadTreeFolders(anc.path, node, false); node.setAttribute('open', ''); currentContainer = node; } }
    this.realTree.querySelectorAll('[selected]').forEach(el => el.removeAttribute('selected'));
    if(currentContainer !== this.realTree) { currentContainer.setAttribute('selected', ''); currentContainer.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
  }

  navigate(path, isHistoryTravel = false) { this.loadPath(path, isHistoryTravel); }
  goBack() { if (this.historyIndex > 0) { this.historyIndex--; this.loadPath(this.history[this.historyIndex], true); } }
  goForward() { if (this.historyIndex < this.history.length - 1) { this.historyIndex++; this.loadPath(this.history[this.historyIndex], true); } }
  goUp() { if (this.currentPath !== 'C:') { const parts = this.currentPath.split('/'); parts.pop(); this.loadPath(parts.join('/')); } }

  async loadPath(path, isHistoryTravel = false) {
    try {
      this.mainview.showSkeleton(true);
      const ancestors = await API.getAncestors(path), items = await API.getFolderContents(path);
      this.currentPath = path; 
      if (!isHistoryTravel) { this.history = this.history.slice(0, this.historyIndex + 1); this.history.push(path); this.historyIndex++; }
      this.addressbar.setPath(path, ancestors);
      this.addressbar.updateNavState(this.historyIndex > 0, this.historyIndex < this.history.length - 1, path !== 'C:');
      this.mainview.showSkeleton(false); this.mainview.setItems(items); this.syncTreeState(path);
    } catch (e) { this.mainview.showSkeleton(false); showToast(e.message || "访问错误", true); }
  }

  showPreview(path) {
     const ext = path.split('.').pop().toLowerCase(), name = path.split('/').pop();
     document.getElementById('preview-title').innerText = name + ' - 预览器';
     const body = document.getElementById('preview-body');
     if(['png','jpg','jpeg','gif'].includes(ext)) { body.innerHTML = `<div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;"><div class="ico" style="width:120px;height:120px">${getSvg('image', '#0090ff')}</div><p style="color:var(--slate-8); margin-top:20px;">[内置图形引擎]</p></div>`; } 
     else { body.innerHTML = `<textarea style="flex:1; border:none; padding:20px; resize:none; font-family: 'Consolas', monospace; font-size:14px; background:var(--slate-1); color:var(--slate-11); outline:none;" readonly>/**\n * 文件: ${name}\n * 路径: ${path}\n * (此为沙盒安全展示)\n */\n\nconsole.log("Hello, Windows File Explorer Ultimate!");</textarea>`; }
     document.getElementById('preview-modal').classList.add('active');
  }

  async handleAction(action) {
    const selected = Array.from(this.mainview.selectedIds);
    try {
      if (action.startsWith('sort-')) { this.mainview.sortItems(action.replace('sort-', '')); }
      else if (action === 'viewToggle') { this.mainview.toggleViewMode(); this.ribbon.updateViewIcon(this.mainview.viewMode === 'list'); }
      else if (action === 'refresh') this.loadPath(this.currentPath, true);
      else if (action === 'selectall') this.mainview.selectAll();
      else if (action === 'selectnone') this.mainview.clearSelection();
      else if (action === 'invert') this.mainview.invertSelection();
      else if (action === 'open') { if(selected.length === 1 && this.mainview.items.find(i => i.path === selected[0]).type === 'folder') this.loadPath(selected[0]); }
      else if (action === 'view-file') { if(selected.length === 1 && this.mainview.items.find(i => i.path === selected[0]).type === 'file') this.showPreview(selected[0]); }
      else if (action === 'delete') {
         if(!selected.length) return showToast("请先选择要删除的项", true);
         if(confirm(`确定永久删除这 ${selected.length} 个项目吗？`)) { await API.deleteItems(selected); if (selected.some(p => this.currentPath === p || this.currentPath.startsWith(p + '/'))) this.currentPath = 'C:'; this.rebuildTree(); this.loadPath(this.currentPath, true); showToast(`回收站: 已清除 ${selected.length} 个项目`); }
      }
      else if (action.startsWith('new')) {
         let type = 'file', ext = '.txt';
         if(action === 'newfolder') { type = 'folder'; ext = ''; }
         else if (action === 'newfile-md') ext = '.md';
         else if (action === 'newfile-js') ext = '.js';
         const name = prompt("请输入名称:", type === 'folder' ? "新建文件夹" : "新文件" + ext);
         if (!name) return; if (!isValidName(name)) return showToast("名称不合法", true);
         await API.createItem(this.currentPath, type, name); this.rebuildTree(); this.loadPath(this.currentPath, true);
      }
      else if (action === 'rename') {
         if(selected.length !== 1) return showToast("只能选择单一项目进行重命名", true);
         const oldPath = selected[0]; const oldName = oldPath.substring(oldPath.lastIndexOf('/') + 1); const newName = prompt("重命名为:", oldName);
         if (!newName || newName === oldName) return; if (!isValidName(newName)) return showToast("名称不合法", true);
         await API.renameItem(oldPath, newName); const parentPath = oldPath.substring(0, oldPath.lastIndexOf('/')) || 'C:';
         if (this.currentPath === oldPath) this.currentPath = normalizePath(parentPath, newName); else if (this.currentPath.startsWith(oldPath + '/')) this.currentPath = this.currentPath.replace(oldPath, normalizePath(parentPath, newName));
         this.rebuildTree(); this.loadPath(this.currentPath, true);
      }
      else if (action === 'properties') {
         if(selected.length !== 1) return showToast("请选择单个文件查看属性", true);
         const prop = API.getProperties(selected[0]); document.getElementById('prop-title').innerText = prop.name + ' 的属性';
         document.getElementById('prop-body').innerHTML = `<div class="prop-row"><span>类型：</span><span>${prop.type === 'folder' ? '文件夹' : '文件'}</span></div><div class="prop-row"><span>位置：</span><span style="word-break:break-all">${selected[0]}</span></div><div class="prop-row"><span>大小：</span><span>${formatBytes(prop.size)}</span></div><div class="prop-row"><span>创建时间：</span><span>${prop.created}</span></div><div class="prop-row"><span>修改时间：</span><span>${prop.modified}</span></div><div class="prop-row"><span>权限：</span><span>${prop.perms}</span></div><div class="prop-row"><span>所有者：</span><span>${prop.owner}</span></div>`;
         document.getElementById('prop-modal').classList.add('active');
      }
      else if (['copy', 'paste', 'cut', 'download', 'undo'].includes(action)) showToast(`模拟执行高级系统操作: [${action}]`);
    } catch(e) { showToast(e.message, true); }
  }
}
customElements.define("win-file-explorer", WinFileExplorer);
